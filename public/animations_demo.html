<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Animation Demos</title>
<style>
  body {
    background-color: #2b0914;
    color: white;
    font-family: sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
    gap: 40px;
  }
  .demo-container {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    width: 150px;
  }
  .brand {
    width: 80px;
    height: 80px;
    background-color: transparent;
    border: 2px solid #D4AF37;
    border-radius: 50%;
    display: flex;
    justify-content: center;
    align-items: center;
    margin-bottom: 20px;
    cursor: pointer;
  }
  .bird {
    width: 40px;
    height: 40px;
    background-color: #D4AF37;
    clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
  }
  
  /* 1. Slow Spin */
  @keyframes slowSpin {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }
  .anim-1 .bird {
    animation: slowSpin 5s linear infinite; /* sped up for demo */
    transition: filter 0.3s;
  }
  .anim-1:hover .bird {
    filter: drop-shadow(0 0 12px rgba(212, 175, 55, 0.8));
  }

  /* 2. 3D Flip */
  .anim-2 .bird {
    transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1), filter 0.3s;
    transform-style: preserve-3d;
  }
  .anim-2:hover .bird {
    transform: rotateY(180deg) scale(1.1);
    filter: drop-shadow(0 0 10px rgba(212, 175, 55, 0.7));
  }

  /* 3. Float */
  @keyframes float {
    0% { transform: translateY(0px); }
    50% { transform: translateY(-10px); }
    100% { transform: translateY(0px); }
  }
  .anim-3 .bird {
    animation: float 2s ease-in-out infinite; /* sped up for demo */
    transition: filter 0.3s;
  }
  .anim-3:hover .bird {
    filter: drop-shadow(0 0 15px rgba(212, 175, 55, 0.9));
  }

  /* 4. Heartbeat */
  @keyframes heartbeatPulse {
    0% { transform: scale(1); filter: drop-shadow(0 0 2px rgba(212, 175, 55, 0.3)); }
    50% { transform: scale(1.15); filter: drop-shadow(0 0 15px rgba(212, 175, 55, 0.8)); }
    100% { transform: scale(1); filter: drop-shadow(0 0 2px rgba(212, 175, 55, 0.3)); }
  }
  .anim-4:hover .bird {
    animation: heartbeatPulse 1s ease-in-out infinite;
  }
</style>
</head>
<body>

  <div class="demo-container">
    <div class="brand anim-1" id="box1"><div class="bird"></div></div>
    <span>1. Spin</span>
  </div>

  <div class="demo-container">
    <div class="brand anim-2" id="box2"><div class="bird"></div></div>
    <span>2. 3D Flip</span>
  </div>

  <div class="demo-container">
    <div class="brand anim-3" id="box3"><div class="bird"></div></div>
    <span>3. Float</span>
  </div>

  <div class="demo-container">
    <div class="brand anim-4" id="box4"><div class="bird"></div></div>
    <span>4. Heartbeat</span>
  </div>

</body>
</html>
